<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esmaga Link — Encurtador de URLs</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span>Esmaga Link</span>
      </a>
      <nav class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema" title="Alternar tema">
          <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="/dashboard" class="btn btn-primary btn-sm">Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="hero-shell">
    <section class="hero-center">
      <h1 class="hero-logo">Esmaga<span>Link</span></h1>
      <p class="hero-subtitle">Cole uma URL longa para gerar um link curto e QR Code em milissegundos.</p>

      <div id="home-error" class="alert alert-error" hidden></div>

      <form id="shorten-form" class="hero-search-form">
        <input
          id="url-input"
          type="url"
          placeholder="Cole aqui sua URL (ex: https://github.com/usuario/repositorio)"
          required
          autocomplete="off"
          aria-label="URL para encurtar"
        >
        <button id="shorten-btn" class="btn btn-primary" type="submit">Esmagar</button>
      </form>

      <section id="result-card" class="card hero-result" hidden>
        <div class="result-grid">
          <div class="form-stack">
            <div class="short-url-box">
              <span id="result-link-slot"></span>
              <button id="copy-result-btn" class="btn btn-secondary btn-sm" type="button">Copiar</button>
            </div>
            <p id="result-original" class="muted"></p>
          </div>
          <div class="qr-box">
            <canvas id="result-qr-canvas" width="160" height="160"></canvas>
            <button id="download-qr-btn" class="btn btn-secondary btn-sm" type="button">Baixar QR</button>
          </div>
        </div>
      </section>
    </section>

    <section id="history-section" class="hero-history" hidden>
      <div class="hero-history-header">
        <h2 class="hero-history-title">Recentes nesta máquina</h2>
        <button id="clear-history-btn" class="btn btn-secondary btn-sm" type="button">Limpar</button>
      </div>
      <div class="card">
        <div id="history-table-wrap" class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Link Curto</th>
                <th>Destino</th>
                <th>Criado em</th>
                <th>Ações</th>
              </tr>
            </thead>
            <tbody id="history-tbody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" crossorigin="anonymous"></script>
  <script type="module" src="/js/home.js"></script>
</body>
</html>
