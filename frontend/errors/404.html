<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <meta name="description" content="Página não encontrada no Esmaga Link.">
  <title>Esmaga Link — Página não encontrada</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo principal</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 14L14 10"></path>
            <path d="M11 17l-1.5 1.5a3.5 3.5 0 0 1-5-5L6 12"></path>
            <path d="M13 7l1.5-1.5a3.5 3.5 0 0 1 5 5L18 12"></path>
          </svg>
        </span>
        <span>Esmaga Link</span>
      </a>
      <nav class="nav-actions" aria-label="Navegação principal">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema" title="Alternar tema" aria-pressed="false">
          <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="/dashboard" class="btn btn-primary btn-sm">Acessar painel</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container error-shell">
    <section class="card error-card" aria-labelledby="error-heading">
      <div class="error-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"></circle>
          <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
          <line x1="9" y1="9" x2="9.01" y2="9"></line>
          <line x1="15" y1="9" x2="15.01" y2="9"></line>
        </svg>
      </div>
      <p class="error-code mono">Erro 404</p>
      <h1 id="error-heading" class="error-title">Página não encontrada</h1>
      <p class="error-desc">O endereço que você tentou acessar não foi encontrado. Volte para a página inicial ou acesse o painel para continuar.</p>
      <div class="error-actions">
        <a href="/" class="btn btn-primary">Voltar para o início</a>
        <a href="/dashboard" class="btn btn-secondary">Acessar painel</a>
      </div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Esmaga Link — Encurtador de URLs.</span>
      <nav class="footer-links" aria-label="Links do rodapé">
        <a href="/">Início</a>
        <a href="/dashboard">Painel</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="/js/error-page.js"></script>
</body>
</html>
