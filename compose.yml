services:

  postgres:
    image: postgres:16-alpine
    container_name: esmaga-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./deployments/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  cassandra:
    image: cassandra:4.1
    container_name: esmaga-cassandra
    restart: always
    environment:
      CASSANDRA_CLUSTER_NAME: "esmaga-cluster"
      CASSANDRA_DC: "datacenter1"
      CASSANDRA_ENDPOINT_SNITCH: "GossipingPropertyFileSnitch"
      MAX_HEAP_SIZE: "512M"
      HEAP_NEWSIZE: "128M"
    volumes:
      - cassandradata:/var/lib/cassandra
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe cluster' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 40s

  cassandra-init:
    image: cassandra:4.1
    container_name: esmaga-cassandra-init
    depends_on:
      cassandra:
        condition: service_healthy
    volumes:
      - ./deployments/cassandra/init.cql:/init.cql:ro
    command: >
      bash -c "cqlsh cassandra 9042 -f /init.cql && echo 'Cassandra schema inicializado com sucesso!'"
    restart: "no"

  redis:
    image: redis:7-alpine
    container_name: esmaga-redis
    restart: always
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: esmaga-rabbitmq
    restart: always
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS}
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: deployments/api/Dockerfile
    container_name: esmaga-api
    restart: always
    environment:
      PORT: ${PORT}
      INSTANCE_ID: ${INSTANCE_ID}
      POSTGRES_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      CASSANDRA_HOSTS: "cassandra"
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
      JWT_SECRET: ${JWT_SECRET}
      ALPHABET_SEED: ${ALPHABET_SEED}
      ID_BATCH_SIZE: ${ID_BATCH_SIZE}
      APP_BASE_URL: ${APP_BASE_URL}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY}
      TURNSTILE_HOSTNAMES: ${TURNSTILE_HOSTNAMES:-}
      PORTFOLIO_MODE: ${PORTFOLIO_MODE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deployments/worker/Dockerfile
    container_name: esmaga-worker
    restart: always
    environment:
      INSTANCE_ID: ${INSTANCE_ID}
      POSTGRES_URL: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      CASSANDRA_HOSTS: "cassandra"
      CASSANDRA_KEYSPACE: ${CASSANDRA_KEYSPACE}
      RABBITMQ_URL: "amqp://${RABBITMQ_USER}:${RABBITMQ_PASS}@rabbitmq:5672/"
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASS: ${SMTP_PASS}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TLS: ${SMTP_TLS}
    depends_on:
      postgres:
        condition: service_healthy
      cassandra:
        condition: service_healthy
      cassandra-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: esmaga-nginx
    restart: always
    ports:
      - "${HOST_NGINX_PORT}:80"
    volumes:
      - ./deployments/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - api

volumes:
  pgdata:
  cassandradata:
  redisdata:
  rabbitmqdata:
