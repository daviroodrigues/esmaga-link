<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Confirme seu endereço de e-mail para ativar sua conta no Esmaga Link.">
  <title>Esmaga Link — Verificar e-mail</title>
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <script src="/js/theme-init.js"></script>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo principal</a>

  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 14L14 10"></path>
            <path d="M11 17l-1.5 1.5a3.5 3.5 0 0 1-5-5L6 12"></path>
            <path d="M13 7l1.5-1.5a3.5 3.5 0 0 1 5 5L18 12"></path>
          </svg>
        </span>
        <span>Esmaga Link</span>
      </a>
      <nav class="nav-actions" aria-label="Navegação principal">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema" title="Alternar tema" aria-pressed="false">
          <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="/dashboard" class="btn btn-primary btn-sm">Ir para o painel</a>
      </nav>
    </div>
  </header>

  <main id="main-content" class="container container-narrow">
    <section class="card auth-card" aria-labelledby="verify-heading">
      <h1 id="verify-heading" class="card-title">Confirmação de e-mail</h1>
      <p id="verify-status" class="card-subtitle" role="status" aria-live="polite">Validando seu link de confirmação...</p>
      <div id="verify-success" class="alert alert-success" role="status" aria-live="polite" hidden></div>
      <div id="verify-error" class="alert alert-error" role="alert" hidden></div>

      <div id="verify-actions" class="form-stack" hidden>
        <a href="/dashboard" class="btn btn-primary">Entrar na conta</a>
      </div>

      <form id="resend-form" class="form-stack" hidden>
        <p class="muted no-margin">Precisa de um novo link de confirmação?</p>
        <div class="field">
          <label for="resend-email">E-mail</label>
          <input id="resend-email" type="email" required autocomplete="email" placeholder="voce@exemplo.com">
        </div>
        <button id="resend-btn" class="btn btn-secondary" type="submit">Reenviar verificação</button>
      </form>
    </section>
  </main>

  <footer class="site-footer">
    <div class="site-footer-inner">
      <span>Esmaga Link — Encurtador de URLs.</span>
      <nav class="footer-links" aria-label="Links do rodapé">
        <a href="/">Início</a>
        <a href="/dashboard">Painel</a>
      </nav>
    </div>
  </footer>

  <script type="module" src="/js/verify-email.js"></script>
</body>
</html>
