<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esmaga Link — Redefinir Senha</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand"><span>Esmaga Link</span></a>
      <nav class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema" title="Alternar tema">
          <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="/dashboard" class="btn btn-secondary btn-sm">Voltar ao Login</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card auth-card">
      <h1 class="card-title">Criar Nova Senha</h1>
      <p id="reset-status" class="muted">Informe sua nova senha abaixo.</p>
      <div id="reset-success" class="alert alert-success" hidden></div>
      <div id="reset-error" class="alert alert-error" hidden></div>

      <form id="reset-form" class="form-stack">
        <div class="field">
          <label for="reset-password">Nova senha (mín. 6 caracteres)</label>
          <div class="password-wrap">
            <input id="reset-password" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••">
            <button class="password-toggle" type="button" data-toggle-password="reset-password" aria-label="Mostrar senha" title="Mostrar senha">
              <svg data-eye="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg data-eye="closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <div class="field">
          <label for="reset-password-confirm">Confirmar nova senha</label>
          <div class="password-wrap">
            <input id="reset-password-confirm" type="password" required minlength="6" autocomplete="new-password" placeholder="••••••••">
            <button class="password-toggle" type="button" data-toggle-password="reset-password-confirm" aria-label="Mostrar senha" title="Mostrar senha">
              <svg data-eye="open" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle>
              </svg>
              <svg data-eye="closed" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line>
              </svg>
            </button>
          </div>
        </div>
        <button id="reset-btn" class="btn btn-primary" type="submit">Redefinir Senha</button>
      </form>
    </section>
  </main>

  <script type="module" src="/js/reset-password.js"></script>
</body>
</html>
