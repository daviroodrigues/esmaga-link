<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Esmaga Link — Verificar E-mail</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand"><span>Esmaga Link</span></a>
      <nav class="nav-actions">
        <button id="theme-toggle" class="icon-btn" type="button" aria-label="Alternar tema" title="Alternar tema">
          <svg data-theme-icon="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="4"></circle>
            <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path>
          </svg>
          <svg data-theme-icon="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" hidden>
            <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
          </svg>
        </button>
        <a href="/dashboard" class="btn btn-primary btn-sm">Ir para o Dashboard</a>
      </nav>
    </div>
  </header>

  <main class="container">
    <section class="card auth-card">
      <h1 class="card-title">Confirmação de E-mail</h1>
      <p id="verify-status" class="muted">Validando seu token de verificação...</p>
      <div id="verify-success" class="alert alert-success" hidden></div>
      <div id="verify-error" class="alert alert-error" hidden></div>

      <div id="verify-actions" class="form-stack" hidden>
        <a href="/dashboard" class="btn btn-primary">Entrar na conta</a>
      </div>

      <form id="resend-form" class="form-stack" hidden>
        <p class="muted">Precisa de um novo link de confirmação?</p>
        <div class="field">
          <label for="resend-email">E-mail</label>
          <input id="resend-email" type="email" required autocomplete="email" placeholder="seu.nome@dominio.com">
        </div>
        <button id="resend-btn" class="btn btn-secondary" type="submit">Reenviar verificação</button>
      </form>
    </section>
  </main>

  <script type="module" src="/js/verify-email.js"></script>
</body>
</html>
